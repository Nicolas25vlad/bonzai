name: Apply v0.3.0 persistent tree

on:
  push:
    branches: [main]
    paths:
      - 'tools/persistent_tree_v030.py'
      - '.github/workflows/apply-persistent-tree-v030.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Apply persistent tree migration
        run: python3 tools/persistent_tree_v030.py

      - name: Validate
        run: |
          cargo fmt --all
          cargo check --locked --all-targets
          cargo test --locked --all-targets
          cargo clippy --locked --all-targets -- -D warnings
          cargo build --release --locked

      - name: Commit persistent tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.rs tests/unit.rs tests/cli.rs Cargo.toml Cargo.lock README.md
          git diff --cached --quiet && exit 0
          git commit -m "feat: persist branch topology across growth"
          git push
