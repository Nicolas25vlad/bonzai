name: Apply v0.3.0 persistent tree

on:
  push:
    branches: [main]
    paths:
      - 'tools/persistent_tree_v030.py'
      - '.github/workflows/apply-persistent-tree-v030.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Apply persistent tree migration
        run: python3 tools/persistent_tree_v030.py

      - name: Normalize generated code
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          main = Path('src/main.rs')
          s = main.read_text()
          s = s.replace(
              'fn is_tree_cell(cell: Cell) -> bool {',
              '#[allow(dead_code)]\nfn is_tree_cell(cell: Cell) -> bool {',
              1,
          )

          pattern = re.compile(
              r'        let side = if parent\.side == 0 \{.*?        \};\n        let light_pull',
              re.S,
          )
          replacement = '''        let random_side = if rng.chance(1, 2) { -1 } else { 1 };
          let side = if parent.side == 0 {
              if shape_bias > 0.18 && rng.chance(68, 100) {
                  1
              } else if shape_bias < -0.18 && rng.chance(68, 100) {
                  -1
              } else {
                  random_side
              }
          } else if rng.chance(72, 100) {
              parent.side
          } else {
              -parent.side
          };
          let light_pull'''
          s, count = pattern.subn(replacement, s, count=1)
          if count != 1:
              raise SystemExit(f'side selection replacement count: {count}')
          main.write_text(s)

          tests = Path('tests/unit.rs')
          t = tests.read_text()
          old_sig = '        fn topology_signature(st: &State) -> Vec<(u32, u32, i8, u8, u8, i8, u8, bool, u32)> {'
          new_sig = '''        type TopologySignature = (u32, u32, i8, u8, u8, i8, u8, bool, u32);

          fn topology_signature(st: &State) -> Vec<TopologySignature> {'''
          if old_sig not in t:
              raise SystemExit('topology signature helper not found')
          tests.write_text(t.replace(old_sig, new_sig, 1))
          PY

      - name: Validate
        run: |
          cargo fmt --all
          cargo check --locked --all-targets
          cargo test --locked --all-targets
          cargo clippy --locked --all-targets -- -D warnings
          cargo build --release --locked

      - name: Commit persistent tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.rs tests/unit.rs tests/cli.rs Cargo.toml Cargo.lock README.md
          git diff --cached --quiet && exit 0
          git commit -m "feat: persist branch topology across growth"
          git push
