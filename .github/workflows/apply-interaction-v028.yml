name: Apply v0.2.8 interaction fixes

on:
  push:
    branches: [main]
    paths:
      - 'tools/interaction_fix_v028.py'
      - '.github/workflows/apply-interaction-v028.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Apply interaction fixes
        run: python3 tools/interaction_fix_v028.py

      - name: Validate
        run: |
          cargo fmt --all
          cargo check --locked --all-targets
          cargo test --locked --all-targets
          cargo clippy --locked --all-targets -- -D warnings
          cargo build --release --locked

      - name: Commit interaction fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.rs tests/unit.rs Cargo.toml Cargo.lock
          git diff --cached --quiet && exit 0
          git commit -m "fix: make care actions update immediately and visibly"
          git push
