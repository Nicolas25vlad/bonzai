name: Apply v0.2.5 refactor

on:
  push:
    branches: [main]
    paths:
      - 'tools/refactor_v025.py'
      - 'tools/prepare_refactor_v025.py'
      - '.github/workflows/apply-v025-refactor.yml'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Prepare refactor
        run: python3 tools/prepare_refactor_v025.py

      - name: Apply refactor
        run: python3 tools/refactor_v025.py

      - name: Validate
        run: |
          cargo fmt --all
          cargo check --locked --all-targets
          cargo test --locked --all-targets
          cargo clippy --locked --all-targets -- -D warnings
          cargo build --release --locked

      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.rs Cargo.toml Cargo.lock
          git diff --cached --quiet && exit 0
          git commit -m "refactor: make watch smooth, lighter and more organic"
          git push
