name: Apply quality cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-quality-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean clippy findings
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/main.rs')
          s = p.read_text()

          s = s.replace(
              'fn draw_cb_branch(\n',
              '// This recursive walker carries the complete branch state explicitly.\n// Keeping it flat makes the growth rules easier to audit at call sites.\n#[allow(clippy::too_many_arguments)]\nfn draw_cb_branch(\n',
              1,
          )

          old_side = '''            let side = if prefer_right && rng.chance(63, 100) {
                1
            } else if prefer_left && rng.chance(63, 100) {
                -1
            } else if rng.chance(1, 2) {
                -1
            } else {
                1
            };'''
          new_side = '''            let preferred_side = if prefer_right {
                Some(1)
            } else if prefer_left {
                Some(-1)
            } else {
                None
            };
            let side = match preferred_side {
                Some(side) if rng.chance(63, 100) => side,
                _ if rng.chance(1, 2) => -1,
                _ => 1,
            };'''
          if old_side not in s:
              raise SystemExit('side selection block not found')
          s = s.replace(old_side, new_side, 1)

          old_memory = '''    println!(
        "{SOIL}memory{RESET} L {:.1}h  C {:.1}h  R {:.1}h",
        st.light_left_hours, st.light_center_hours, st.light_right_hours
    );'''
          new_memory = '''    println!(
        "{SOIL}memory{RESET} L {:.1}h  C {:.1}h  R {:.1}h  ·  total {:.1}h",
        st.light_left_hours,
        st.light_center_hours,
        st.light_right_hours,
        st.total_light_hours()
    );'''
          if old_memory not in s:
              raise SystemExit('memory status block not found')
          s = s.replace(old_memory, new_memory, 1)

          s = s.replace(
              '    print!("\\x1b[?25h\\x1b[0m\\n");',
              '    println!("\\x1b[?25h\\x1b[0m");',
              1,
          )

          p.write_text(s)
          PY

      - name: Validate
        run: |
          cargo fmt --all
          cargo check --locked --all-targets
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets
          cargo build --release --locked

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.rs
          git diff --cached --quiet && exit 0
          git commit -m "refactor: resolve strict clippy findings"
          git push
