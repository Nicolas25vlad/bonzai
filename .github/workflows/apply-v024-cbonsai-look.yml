name: Apply v0.2.4 cbonsai look

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v024-cbonsai-look.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Port cbonsai visual grammar
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/main.rs')
          s = p.read_text()

          s = s.replace('const VERSION: &str = "0.2.3";', 'const VERSION: &str = "0.2.4";')
          s = s.replace('const TRUNK: &str = "\\x1b[38;5;137m";', 'const TRUNK: &str = "\\x1b[38;5;11m";')
          s = s.replace('const TRUNK_DARK: &str = "\\x1b[38;5;94m";', 'const TRUNK_DARK: &str = "\\x1b[38;5;3m";')
          s = s.replace('const LEAF: &str = "\\x1b[38;5;108m";', 'const LEAF: &str = "\\x1b[38;5;2m";')
          s = s.replace('const LEAF_BRIGHT: &str = "\\x1b[38;5;151m";', 'const LEAF_BRIGHT: &str = "\\x1b[1;38;5;10m";')
          s = s.replace('const LEAF_DARK: &str = "\\x1b[38;5;65m";', 'const LEAF_DARK: &str = "\\x1b[38;5;2m";')
          s = s.replace('const POT: &str = "\\x1b[38;5;173m";', 'const POT: &str = "\\x1b[38;5;245m";')

          start = s.index('fn draw_branch(')
          end = s.index('fn bar(', start)

          renderer = r'''// Visual grammar intentionally follows the classic cbonsai look.
          // cbonsai is GPL-3.0 and credited in README.md. Bonzai keeps its own
          // persistent simulation while using a compatible terminal aesthetic.
          #[derive(Copy, Clone, PartialEq)]
          enum BranchKind {
              Trunk,
              Left,
              Right,
              Dying,
              Dead,
          }

          fn draw_str(c: &mut Canvas, x: i32, y: i32, text: &str, kind: u8) {
              for (i, ch) in text.chars().enumerate() {
                  if ch != ' ' {
                      c.set(x + i as i32, y, ch, kind);
                  }
              }
          }

          fn branch_delta(
              rng: &mut Rng,
              kind: BranchKind,
              age: i32,
              vigor: f32,
              tropism: f32,
          ) -> (i32, i32) {
              let light_pull = if tropism > 0.25 {
                  1
              } else if tropism < -0.25 {
                  -1
              } else {
                  0
              };

              match kind {
                  BranchKind::Trunk => {
                      let mut dx = if age < 8 {
                          rng.range(-2, 3)
                      } else {
                          rng.range(-1, 2)
                      };
                      if light_pull != 0 && rng.chance(24, 100) {
                          dx += light_pull;
                      }
                      let dy = if age < 5 {
                          if rng.chance(30, 100) { -1 } else { 0 }
                      } else if rng.chance((58.0 + vigor * 26.0) as u64, 100) {
                          -1
                      } else {
                          0
                      };
                      (dx.clamp(-2, 2), dy)
                  }
                  BranchKind::Left => {
                      let mut dx = match rng.next() % 10 {
                          0 | 1 => -2,
                          2..=6 => -1,
                          7 | 8 => 0,
                          _ => 1,
                      };
                      if light_pull < 0 && rng.chance(30, 100) {
                          dx -= 1;
                      }
                      let dy = match rng.next() % 10 {
                          0 | 1 => -1,
                          8 | 9 => 1,
                          _ => 0,
                      };
                      (dx.clamp(-3, 1), dy)
                  }
                  BranchKind::Right => {
                      let mut dx = match rng.next() % 10 {
                          0 | 1 => 2,
                          2..=6 => 1,
                          7 | 8 => 0,
                          _ => -1,
                      };
                      if light_pull > 0 && rng.chance(30, 100) {
                          dx += 1;
                      }
                      let dy = match rng.next() % 10 {
                          0 | 1 => -1,
                          8 | 9 => 1,
                          _ => 0,
                      };
                      (dx.clamp(-1, 3), dy)
                  }
                  BranchKind::Dying => {
                      let mut dx = rng.range(-3, 4);
                      if light_pull != 0 && rng.chance(28, 100) {
                          dx += light_pull;
                      }
                      let dy = if rng.chance(18, 100) {
                          -1
                      } else if rng.chance(8, 100) {
                          1
                      } else {
                          0
                      };
                      (dx.clamp(-3, 3), dy)
                  }
                  BranchKind::Dead => (rng.range(-1, 2), rng.range(-1, 2)),
              }
          }

          fn branch_glyph(kind: BranchKind, life: i32, dx: i32, dy: i32) -> &'static str {
              if life < 4 || matches!(kind, BranchKind::Dying | BranchKind::Dead) {
                  return "&";
              }

              match kind {
                  BranchKind::Trunk => {
                      if dy == 0 {
                          "/~"
                      } else if dx < 0 {
                          "\\|"
                      } else if dx == 0 {
                          "/|\\"
                      } else {
                          "|/"
                      }
                  }
                  BranchKind::Left => {
                      if dy > 0 {
                          "\\"
                      } else if dy == 0 {
                          "\\_"
                      } else if dx < 0 {
                          "\\|"
                      } else if dx == 0 {
                          "/|"
                      } else {
                          "/"
                      }
                  }
                  BranchKind::Right => {
                      if dy > 0 {
                          "/"
                      } else if dy == 0 {
                          "_/"
                      } else if dx < 0 {
                          "\\|"
                      } else if dx == 0 {
                          "/|"
                      } else {
                          "/"
                      }
                  }
                  BranchKind::Dying | BranchKind::Dead => "&",
              }
          }

          fn draw_leaf_spray(
              c: &mut Canvas,
              rng: &mut Rng,
              x: i32,
              y: i32,
              vigor: f32,
              tropism: f32,
          ) {
              let count = (7.0 + vigor * 13.0) as i32;
              let pull = if tropism > 0.25 {
                  1
              } else if tropism < -0.25 {
                  -1
              } else {
                  0
              };
              for _ in 0..count {
                  let mut dx = rng.range(-4, 5);
                  if pull != 0 && rng.chance(42, 100) {
                      dx += pull;
                  }
                  let dy = rng.range(-2, 3);
                  let bright = rng.chance((12.0 + vigor * 20.0) as u64, 100);
                  c.set(x + dx, y + dy, '&', if bright { 3 } else { 2 });
              }
          }

          fn draw_cb_branch(
              c: &mut Canvas,
              rng: &mut Rng,
              mut x: i32,
              mut y: i32,
              kind: BranchKind,
              mut life: i32,
              depth: u8,
              vigor: f32,
              tropism: f32,
              prune_left: u32,
              prune_right: u32,
          ) {
              let start_life = life.max(1);
              let mut age = 0;
              let mut shoot_cooldown = 3i32;

              while life > 0 && y > 2 && y < c.h - 4 {
                  life -= 1;
                  age += 1;

                  let effective_kind = if life < 4 {
                      BranchKind::Dying
                  } else {
                      kind
                  };
                  let (dx, dy) = branch_delta(rng, effective_kind, age, vigor, tropism);

                  x = (x + dx).clamp(3, c.w - 5);
                  y = (y + dy).clamp(2, c.h - 6);

                  let glyph = branch_glyph(effective_kind, life, dx, dy);
                  let cell_kind = if matches!(effective_kind, BranchKind::Dying | BranchKind::Dead) {
                      if rng.chance(18, 100) { 3 } else { 2 }
                  } else if rng.chance(45, 100) {
                      1
                  } else {
                      5
                  };
                  draw_str(c, x, y, glyph, cell_kind);

                  if life <= 2 {
                      draw_leaf_spray(c, rng, x, y, vigor, tropism);
                      if depth < 3 {
                          let leaf_life = 2 + rng.range(0, 3);
                          draw_cb_branch(
                              c,
                              rng,
                              x,
                              y,
                              BranchKind::Dead,
                              leaf_life,
                              depth + 1,
                              vigor,
                              tropism,
                              prune_left,
                              prune_right,
                          );
                      }
                      continue;
                  }

                  if kind == BranchKind::Trunk && life < 6 && depth < 3 {
                      let dying_life = 3 + rng.range(0, 3);
                      draw_cb_branch(
                          c,
                          rng,
                          x,
                          y,
                          BranchKind::Dying,
                          dying_life,
                          depth + 1,
                          vigor,
                          tropism,
                          prune_left,
                          prune_right,
                      );
                  }

                  let branch_gate = ((12.0 + vigor * 17.0) as u64).min(34);
                  if depth < 3 && shoot_cooldown <= 0 && life > 5 && rng.chance(branch_gate, 100) {
                      let prefer_right = tropism > 0.2;
                      let prefer_left = tropism < -0.2;
                      let side = if prefer_right && rng.chance(63, 100) {
                          1
                      } else if prefer_left && rng.chance(63, 100) {
                          -1
                      } else if rng.chance(1, 2) {
                          -1
                      } else {
                          1
                      };

                      let pruned = (side < 0
                          && prune_left > 0
                          && rng.chance(prune_left.min(8) as u64, 10))
                          || (side > 0
                              && prune_right > 0
                              && rng.chance(prune_right.min(8) as u64, 10));

                      if !pruned {
                          let child_kind = if side < 0 {
                              BranchKind::Left
                          } else {
                              BranchKind::Right
                          };
                          let child_life = ((life + start_life / 5) as f32 * (0.62 + vigor * 0.2)) as i32;
                          draw_cb_branch(
                              c,
                              rng,
                              x,
                              y,
                              child_kind,
                              child_life.max(5),
                              depth + 1,
                              vigor,
                              tropism,
                              prune_left,
                              prune_right,
                          );
                      }
                      shoot_cooldown = 4;
                  }

                  shoot_cooldown -= 1;
              }
          }

          fn grow_tree(st: &State, w: i32, h: i32) -> Canvas {
              let mut c = Canvas::new(w, h);
              let base_y = h - 5;
              let base_x = w / 2;
              let mut rng = Rng::new(st.seed);

              let photo = st.photo_bias();
              let current_light_bias = st.light_dir as f32 * (st.light / 100.0) * 0.22;
              let tropism = (photo * 1.1 + current_light_bias).clamp(-1.2, 1.2);
              let stress = ((st.drought_stress + st.wet_stress) / 75.0).clamp(0.0, 0.72);
              let vigor = ((st.health / 100.0) * (1.0 - stress)).clamp(0.18, 1.0);
              let low_light_stretch = ((100.0 - st.light) / 100.0 * 4.0) as i32;

              let life = 12
                  + (st.growth / 100.0 * 22.0) as i32
                  + low_light_stretch
                  - (st.prune_top.min(6) as i32);

              draw_cb_branch(
                  &mut c,
                  &mut rng,
                  base_x,
                  base_y - 1,
                  BranchKind::Trunk,
                  life.max(10),
                  0,
                  vigor,
                  tropism,
                  st.prune_left,
                  st.prune_right,
              );

              // Classic compact cbonsai-style planter.
              let pot = [
                  "(---./~~~\\.---)",
                  " (           ) ",
                  "  (_________)  ",
              ];
              for (i, row) in pot.iter().enumerate() {
                  let sx = base_x - row.chars().count() as i32 / 2;
                  for (j, ch) in row.chars().enumerate() {
                      if ch != ' ' {
                          let kind = if i == 0 && matches!(ch, '~' | '.' | '/' | '\\') {
                              1
                          } else if i == 0 && ch == '-' {
                              3
                          } else {
                              7
                          };
                          c.set(sx + j as i32, base_y + i as i32, ch, kind);
                      }
                  }
              }

              c
          }

          #[derive(Copy, Clone)]
          enum SceneEffect {
              Water(u8),
              Light(i8, u8),
              Prune(i8, u8),
          }

          fn apply_effect(c: &mut Canvas, effect: SceneEffect) {
              let cx = c.w / 2;
              let base_y = c.h - 5;
              match effect {
                  SceneEffect::Water(frame) => {
                      let fall = frame as i32;
                      for (dx, offset) in [(-6, 0), (-2, 2), (2, 1), (6, 3)] {
                          let y = (2 + offset + fall * 3).min(base_y - 2);
                          c.set(cx + dx, y, if frame < 2 { '.' } else { '|' }, 8);
                      }
                  }
                  SceneEffect::Light(dir, frame) => {
                      let x = match dir {
                          -1 => 4,
                          1 => c.w - 5,
                          _ => cx,
                      };
                      c.set(x, 2, '*', 9);
                      if frame > 0 {
                          let step = if dir < 0 { 1 } else if dir > 0 { -1 } else { 0 };
                          for i in 1..=4 {
                              c.set(x + step * i, 2 + i, '.', 9);
                          }
                      }
                  }
                  SceneEffect::Prune(side, frame) => {
                      let x = cx + side as i32 * 9;
                      let y = 9 + frame as i32;
                      c.set(x, y, if frame == 0 { 'x' } else { '+' }, 10);
                  }
              }
          }

          '''

          s = s[:start] + renderer + s[end:]
          p.write_text(s)

          cargo = Path('Cargo.toml')
          cargo.write_text(cargo.read_text().replace('version = "0.2.3"', 'version = "0.2.4"', 1))
          lock = Path('Cargo.lock')
          lock.write_text(lock.read_text().replace('version = "0.2.3"', 'version = "0.2.4"', 1))
          PY

      - name: Format and validate
        run: |
          cargo fmt
          cargo check --locked
          cargo test --locked
          cargo build --release --locked

      - name: Commit cbonsai look
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.rs Cargo.toml Cargo.lock
          git diff --cached --quiet && exit 0
          git commit -m "feat: adopt classic cbonsai visual grammar"
          git push
